<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONO | NAS Authentication</title>
    <script src="/static/tailwind.min.js"></script>
    <script src="/static/vue.global.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ["Space Mono", "monospace"],
                    },
                },
            },
        };
    </script>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap");
        * { font-family: "Space Mono", monospace; }
        body { background-color: #ffffff; color: #000000; }
        .grid-lines {
            background-size: 20px 20px;
            background-image: linear-gradient(to right, rgba(0, 0, 0, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
        }
        [v-cloak] { display: none; }
        .mono-input {
            width: 100%;
            background: transparent;
            border: 2px solid black;
            padding: 0.75rem;
            font-size: 0.875rem;
            font-weight: bold;
            text-transform: uppercase;
            outline: none;
            transition: all 0.2s;
        }
        .mono-input:focus { background: #000; color: #fff; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div id="app" v-cloak class="max-w-md w-full">
        <div class="absolute inset-0 grid-lines opacity-10 pointer-events-none"></div>
        <div class="border-4 border-black p-8 relative bg-white">
            <div class="absolute -top-6 -left-6 bg-black text-white px-4 py-2 text-xs font-bold uppercase tracking-widest">AUTHENTICATION</div>
            <div class="mb-8">
                <h1 class="text-4xl font-bold uppercase tracking-tighter leading-none mb-2">NASPEASY<br>DASHBOARD</h1>
                <p class="text-[10px] font-bold uppercase tracking-widest opacity-60">System management requires authorization.</p>
            </div>
            
            <form @submit.prevent="login" class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold uppercase tracking-widest block mb-1">IDENTIFIER</label>
                    <input v-model="loginForm.username" type="text" class="mono-input" placeholder="ADMIN" required>
                </div>
                <div>
                    <label class="text-[10px] font-bold uppercase tracking-widest block mb-1">SECRET KEY</label>
                    <input v-model="loginForm.password" type="password" class="mono-input" placeholder="••••••••" required>
                </div>
                <div v-if="loginError" class="text-[10px] font-bold uppercase text-white bg-black p-2">
                    ERROR: {% raw %}{{ loginError }}{% endraw %}
                </div>
                <button type="submit" class="w-full bg-black text-white py-4 font-bold uppercase tracking-[0.2em] hover:bg-gray-800 transition-colors">AUTHORIZE ACCESS</button>
            </form>

            <div class="mt-8 pt-8 border-t-2 border-black border-dashed">
                <div class="flex justify-between items-center text-[8px] font-bold uppercase opacity-60">
                    <span>SECURITY LEVEL: 04</span>
                    <span>HOST: {{ local_ip }}</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref } = Vue
        createApp({
            setup() {
                const loginForm = ref({ username: '', password: '' })
                const loginError = ref('')

                const login = async () => {
                    loginError.value = ''
                    try {
                        const res = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(loginForm.value)
                        })
                        if (res.ok) {
                            window.location.href = '/'
                        } else {
                            const data = await res.json()
                            loginError.value = data.error || 'UNAUTHORIZED'
                        }
                    } catch (e) {
                        loginError.value = 'CONNECTION ERROR'
                    }
                }

                return { loginForm, loginError, login }
            }
        }).mount('#app')
    </script>
</body>
</html>
