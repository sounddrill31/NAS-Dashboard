<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONO | System Setup</title>
    <script src="/static/tailwind.min.js"></script>
    <script src="/static/vue.global.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { mono: ["Space Mono", "monospace"] },
                },
            },
        };
    </script>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap");
        * { font-family: "Space Mono", monospace; }
        body { background-color: #ffffff; color: #000000; }
        .grid-lines {
            background-size: 20px 20px;
            background-image: linear-gradient(to right, rgba(0, 0, 0, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
        }
        [v-cloak] { display: none; }
        .mono-input {
            width: 100%;
            background: transparent;
            border: 2px solid black;
            padding: 0.75rem;
            font-size: 0.875rem;
            font-weight: bold;
            text-transform: uppercase;
            outline: none;
            transition: all 0.2s;
        }
        .mono-input:focus { background: #000; color: #fff; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div id="app" v-cloak class="max-w-md w-full">
        <div class="absolute inset-0 grid-lines opacity-10 pointer-events-none"></div>
        <div class="border-4 border-black p-8 relative bg-white">
            <div class="absolute -top-6 -left-6 bg-black text-white px-4 py-2 text-xs font-bold uppercase tracking-widest">INITIAL SETUP</div>
            <div class="mb-8">
                <h1 class="text-4xl font-bold uppercase tracking-tighter leading-none mb-2">WELCOME<br>COMMANDER</h1>
                <p class="text-[10px] font-bold uppercase tracking-widest opacity-60">Initialize system credentials and identity.</p>
            </div>
            
            <form @submit.prevent="runSetup" class="space-y-6">
                <div>
                    <label class="text-[10px] font-bold uppercase tracking-widest block mb-1">ADMIN SECRET KEY</label>
                    <input v-model="form.password" type="password" class="mono-input" placeholder="••••••••" required>
                    <span class="text-[8px] font-bold opacity-40">CHOOSE A STRONG KEY FOR USER 'ADMIN'</span>
                </div>

                <div class="pt-4 border-t-2 border-black border-dashed">
                    <label class="text-[10px] font-bold uppercase tracking-widest block mb-1">SYSTEM IDENTITY (mDNS)</label>
                    <input v-model="form.hostname" type="text" class="mono-input" placeholder="nasypeasy">
                    <span class="text-[8px] font-bold opacity-40">PUBLIC ADDRESS: {% raw %}{{ form.hostname || 'nasypeasy' }}{% endraw %}.local</span>
                </div>

                <div v-if="error" class="text-[10px] font-bold uppercase text-white bg-black p-2">
                    ERROR: {% raw %}{{ error }}{% endraw %}
                </div>
                
                <button type="submit" :disabled="loading" class="w-full bg-black text-white py-4 font-bold uppercase tracking-[0.2em] hover:bg-gray-800 transition-colors disabled:opacity-50">
                    {% raw %}{{ loading ? 'INITIALIZING...' : 'FINALIZE SETUP' }}{% endraw %}
                </button>
            </form>

            <div class="mt-8 pt-8 border-t-2 border-black border-dashed">
                <div class="flex justify-between items-center text-[8px] font-bold uppercase opacity-60">
                    <span>HOST: {{ local_ip }}</span>
                    <span>VER: 0.1.0-MONO</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref } = Vue
        createApp({
            setup() {
                const form = ref({ password: '', hostname: 'nasypeasy' })
                const error = ref('')
                const loading = ref(false)

                const runSetup = async () => {
                    error.value = ''
                    loading.value = true
                    try {
                        const res = await fetch('/api/setup', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(form.value)
                        })
                        if (res.ok) {
                            window.location.href = '/login'
                        } else {
                            const data = await res.json()
                            error.value = data.error || 'SETUP FAILED'
                        }
                    } catch (e) {
                        error.value = 'CONNECTION ERROR'
                    } finally {
                        loading.value = false
                    }
                }

                return { form, error, loading, runSetup }
            }
        }).mount('#app')
    </script>
</body>
</html>
